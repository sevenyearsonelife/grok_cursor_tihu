<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican on a Bicycle</title>
  <style>
    :root {
      --ink: #24343a;
      --muted: #5b6b70;
      --page0: #f3ead6;
      --page1: #d7e4d6;
      --card: #fffdf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 50% -10%, #fff6e4 0%, transparent 70%),
        linear-gradient(180deg, var(--page0) 0%, var(--page1) 100%);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 36px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .lede {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .stage {
      width: min(960px, 100%);
      background: var(--card);
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(36, 52, 58, 0.08);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 18px 50px rgba(36, 52, 58, 0.14);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .cloud {
      animation: drift 42s linear infinite;
    }

    .cloud.slow {
      animation-duration: 68s;
    }

    .wave {
      animation: tide 5.5s ease-in-out infinite;
    }

    .wave.alt {
      animation-duration: 7s;
      animation-delay: -2s;
    }

    .sun-glow {
      animation: glow 4.5s ease-in-out infinite;
    }

    .birds {
      animation: birds 28s linear infinite;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-960px); }
    }

    @keyframes tide {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-18px); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.85; }
    }

    @keyframes birds {
      from { transform: translateX(0); }
      to { transform: translateX(-700px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud, .wave, .sun-glow, .birds {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <script>
    (function () {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const spokesRear = document.getElementById("spokes-rear");
      const spokesFront = document.getElementById("spokes-front");
      const chainring = document.getElementById("chainring");
      const crankFar = document.getElementById("crank-far");
      const crankNear = document.getElementById("crank-near");
      const pedalFar = document.getElementById("pedal-far");
      const pedalNear = document.getElementById("pedal-near");
      const legFar = document.getElementById("leg-far");
      const legNear = document.getElementById("leg-near");
      const footFar = document.getElementById("foot-far");
      const footNear = document.getElementById("foot-near");
      const pelican = document.getElementById("pelican");
      const pouch = document.getElementById("pouch");
      const head = document.getElementById("head");
      const wing = document.getElementById("wing-near");
      const ground = document.getElementById("ground-scroll");
      const shadow = document.getElementById("shadow");

      const BB = { x: 10, y: -10 };
      const CRANK = 24;
      // Neutral hip offsets; the body bob is added per frame so the legs stay attached.
      const HIP_FAR = { x: -18, y: -96 };
      const HIP_NEAR = { x: -6, y: -94 };
      // Long enough that the pedal stays reachable at the bottom of the stroke
      // (hip-to-BB ~93px + 24px crank, plus bob swing) without distance clamping.
      const THIGH = 61;
      const SHIN = 57;

      function ik(hip, foot, l1, l2) {
        let dx = foot.x - hip.x;
        let dy = foot.y - hip.y;
        let dist = Math.hypot(dx, dy);
        const maxLen = l1 + l2 - 0.8;
        const minLen = Math.abs(l1 - l2) + 0.8;
        if (dist > maxLen) dist = maxLen;
        if (dist < minLen) dist = minLen;
        const base = Math.atan2(dy, dx);
        const cosA = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
        const a = Math.acos(Math.max(-1, Math.min(1, cosA)));
        const k1 = { x: hip.x + l1 * Math.cos(base + a), y: hip.y + l1 * Math.sin(base + a) };
        const k2 = { x: hip.x + l1 * Math.cos(base - a), y: hip.y + l1 * Math.sin(base - a) };
        // Knee forward (pelican faces +x); both branches are continuous through the stroke.
        return k1.x > k2.x ? k1 : k2;
      }

      function pedalAt(angle) {
        return {
          x: BB.x + Math.cos(angle) * CRANK,
          y: BB.y + Math.sin(angle) * CRANK
        };
      }

      function setLeg(path, hip, knee, foot) {
        path.setAttribute(
          "d",
          "M " + hip.x + " " + hip.y + " L " + knee.x + " " + knee.y + " L " + foot.x + " " + foot.y
        );
      }

      function frame(now) {
        const t = reduced ? 0.35 : now / 1000;
        const cadence = reduced ? 0 : t * Math.PI * 1.7;
        const wheel = reduced ? 0.4 : t * Math.PI * 3.6;
        const deg = (cadence * 180) / Math.PI;
        const wheelDeg = (wheel * 180) / Math.PI;

        spokesRear.setAttribute("transform", "rotate(" + wheelDeg + ")");
        spokesFront.setAttribute("transform", "rotate(" + wheelDeg + ")");
        chainring.setAttribute("transform", "translate(10 -10) rotate(" + deg + ")");

        const farA = cadence;
        const nearA = cadence + Math.PI;
        const farP = pedalAt(farA);
        const nearP = pedalAt(nearA);

        crankFar.setAttribute("transform", "translate(10 -10) rotate(" + deg + ")");
        crankNear.setAttribute("transform", "translate(10 -10) rotate(" + (deg + 180) + ")");

        pedalFar.setAttribute("transform", "translate(" + farP.x + " " + farP.y + ")");
        pedalNear.setAttribute("transform", "translate(" + nearP.x + " " + nearP.y + ")");

        // Body motion first: hips inherit the bob (plus a hint of the lean) so
        // the thighs stay anchored to the rider instead of floating on their own.
        const bob = Math.sin(cadence * 2) * 2.4;
        const tilt = Math.sin(cadence) * 1.1;
        const hipFar = { x: HIP_FAR.x + Math.sin(cadence) * 0.8, y: HIP_FAR.y + bob };
        const hipNear = { x: HIP_NEAR.x + Math.sin(cadence) * 0.8, y: HIP_NEAR.y + bob };

        const farKnee = ik(hipFar, farP, THIGH, SHIN);
        const nearKnee = ik(hipNear, nearP, THIGH, SHIN);
        setLeg(legFar, hipFar, farKnee, farP);
        setLeg(legNear, hipNear, nearKnee, nearP);

        // Ankles hinge slightly through the stroke (toe dips on the downstroke)
        // so the feet read as jointed, while staying planted on the horizontal pedals.
        const farAnkle = (Math.sin(farA) * 6).toFixed(2);
        const nearAnkle = (Math.sin(nearA) * 6).toFixed(2);
        footFar.setAttribute("transform", "translate(" + farP.x + " " + farP.y + ") rotate(" + farAnkle + ")");
        footNear.setAttribute("transform", "translate(" + nearP.x + " " + nearP.y + ") rotate(" + nearAnkle + ")");

        pelican.setAttribute("transform", "translate(0 " + bob + ") rotate(" + tilt + " -16 -126)");
        head.setAttribute("transform", "rotate(" + (Math.sin(cadence) * 2.2) + " 46 -166)");
        pouch.setAttribute("transform", "rotate(" + (Math.sin(cadence * 2) * 1.6) + " 90 -148)");
        wing.setAttribute("transform", "rotate(" + (Math.sin(cadence * 2) * 1.8) + " -20 -130)");

        const scroll = reduced ? 0 : -((t * 160) % 960);
        ground.setAttribute("transform", "translate(" + scroll + " 0)");

        const squash = 1 + Math.sin(cadence * 2) * 0.06;
        shadow.setAttribute("rx", String(118 * squash));
        shadow.setAttribute("opacity", String(0.2 + Math.sin(cadence * 2) * 0.03));

        if (!reduced) requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
